<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARIF FOOTBALL</title>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
background:#111;
font-family:Arial;
}

canvas{
display:block;
touch-action:none;
}

#score{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
background:#000c;
color:white;
padding:10px 25px;
border-radius:12px;
font-size:20px;
z-index:10;
}

#control{
position:fixed;
bottom:15px;
left:15px;
color:white;
background:#000b;
padding:12px;
border-radius:10px;
z-index:10;
}
</style>
</head>

<body>

<div id="score">ARIF FC 0 : 0 RIVAL</div>

<div id="control">
W A S D / Arrow = Player Move<br>
Ball টেনে Pass / Shoot
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

window.onresize=()=>{
W=innerWidth;
H=innerHeight;
canvas.width=W;
canvas.height=H;
};


/* PLAYER */

let me={
x:W*.25,
y:H*.5,
speed:4,
r:22
};


/* TEAMMATES */

let teammates=[
{x:W*.38,y:H*.35,r:22},
{x:W*.38,y:H*.65,r:22},
{x:W*.48,y:H*.5,r:22}
];


/* OPPONENT */

let enemies=[
{x:W*.68,y:H*.35,r:22},
{x:W*.68,y:H*.65,r:22},
{x:W*.78,y:H*.5,r:22}
];


/* GOALKEEPER */

let keeper={
x:W-45,
y:H*.5,
r:25,
speed:3
};


/* BALL */

let ball={
x:me.x+30,
y:me.y,
r:10,
vx:0,
vy:0
};


/* SCORE */

let home=0;
let away=0;


/* KEYBOARD */

let keys={};

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});


/* PLAYER MOVEMENT */

function moveMe(){

let dx=0;
let dy=0;

if(keys["w"] || keys["arrowup"]) dy-=1;
if(keys["s"] || keys["arrowdown"]) dy+=1;
if(keys["a"] || keys["arrowleft"]) dx-=1;
if(keys["d"] || keys["arrowright"]) dx+=1;

if(dx!==0 || dy!==0){

let len=Math.hypot(dx,dy);

dx/=len;
dy/=len;

me.x+=dx*me.speed;
me.y+=dy*me.speed;

}


/* FIELD LIMIT */

me.x=Math.max(40,Math.min(W-40,me.x));
me.y=Math.max(100,Math.min(H-40,me.y));


/* BALL FOLLOWS PLAYER */

let distance=Math.hypot(
ball.x-me.x,
ball.y-me.y
);

if(distance<45 && Math.abs(ball.vx)<1){

ball.x=me.x+25;
ball.y=me.y;

}

}


/* AI */

function moveAI(){

/* teammates */

teammates.forEach((p,i)=>{

let targetX=ball.x-100;

let targetY=ball.y+(i===0?-100:i===1?100:0);

p.x+=(targetX-p.x)*.015;
p.y+=(targetY-p.y)*.015;

});


/* enemies */

enemies.forEach((p,i)=>{

let targetX=ball.x+80;

let targetY=ball.y+(i-1)*100;

p.x+=(targetX-p.x)*.012;
p.y+=(targetY-p.y)*.012;

});


/* goalkeeper */

keeper.y+=(ball.y-keeper.y)*.04;

keeper.y=Math.max(
H*.5-100,
Math.min(H*.5+100,keeper.y)
);

}


/* BALL */

function updateBall(){

ball.x+=ball.vx;
ball.y+=ball.vy;

ball.vx*=.985;
ball.vy*=.985;


/* walls */

if(ball.y<80){

ball.y=80;
ball.vy*=-.7;

}

if(ball.y>H-30){

ball.y=H-30;
ball.vy*=-.7;

}


/* GOAL */

if(
ball.x>W-10 &&
ball.y>H/2-70 &&
ball.y<H/2+70
){

home++;

updateScore();

reset();

}


if(
ball.x<10 &&
ball.y>H/2-70 &&
ball.y<H/2+70
){

away++;

updateScore();

reset();

}


/* goalkeeper */

let d=Math.hypot(
ball.x-keeper.x,
ball.y-keeper.y
);

if(d<keeper.r+ball.r){

ball.vx=-Math.abs(ball.vx)-4;

}

}


function reset(){

ball.x=me.x+30;
ball.y=me.y;

ball.vx=0;
ball.vy=0;

}


function updateScore(){

document.getElementById("score").innerText=
"ARIF FC "+home+" : "+away+" RIVAL";

}


/* FIELD */

function drawField(){

ctx.fillStyle="#168b3d";
ctx.fillRect(0,0,W,H);

ctx.strokeStyle="white";
ctx.lineWidth=4;

ctx.strokeRect(
20,
70,
W-40,
H-100
);


/* center */

ctx.beginPath();

ctx.moveTo(W/2,70);
ctx.lineTo(W/2,H-30);

ctx.stroke();


ctx.beginPath();

ctx.arc(W/2,H/2,75,0,Math.PI*2);

ctx.stroke();


/* penalty */

ctx.strokeRect(
20,
H/2-110,
120,
220
);

ctx.strokeRect(
W-140,
H/2-110,
120,
220
);


/* goals */

ctx.strokeRect(
0,
H/2-70,
20,
140
);

ctx.strokeRect(
W-20,
H/2-70,
20,
140
);

}


/* PLAYER DRAW */

function drawPlayer(p,color,num){

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.r,
0,
Math.PI*2
);

ctx.fillStyle=color;
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.stroke();

ctx.fillStyle="white";
ctx.font="bold 13px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(
num,
p.x,
p.y
);

}


/* BALL DRAW */

function drawBall(){

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.r,
0,
Math.PI*2
);

ctx.fillStyle="white";
ctx.fill();

ctx.strokeStyle="#111";
ctx.stroke();

}


/* DRAG */

let dragging=false;
let aimX=0;
let aimY=0;

function pointer(e){

let r=canvas.getBoundingClientRect();

return{
x:e.clientX-r.left,
y:e.clientY-r.top
};

}


canvas.onpointerdown=e=>{

let p=pointer(e);

let d=Math.hypot(
p.x-ball.x,
p.y-ball.y
);

if(d<45){

dragging=true;

aimX=p.x;
aimY=p.y;

canvas.setPointerCapture(e.pointerId);

}

};


canvas.onpointermove=e=>{

if(!dragging)return;

let p=pointer(e);

aimX=p.x;
aimY=p.y;

};


canvas.onpointerup=e=>{

if(!dragging)return;

let dx=ball.x-aimX;
let dy=ball.y-aimY;

let len=Math.hypot(dx,dy);

if(len>10){

let power=Math.min(len/7,22);

ball.vx=dx/len*power;
ball.vy=dy/len*power;

}

dragging=false;

};


/* AIM LINE */

function drawAim(){

if(!dragging)return;

ctx.beginPath();

ctx.moveTo(ball.x,ball.y);

ctx.lineTo(aimX,aimY);

ctx.strokeStyle="yellow";
ctx.lineWidth=5;

ctx.stroke();

}


/* GAME */

function game(){

drawField();

moveMe();

moveAI();

updateBall();

teammates.forEach((p,i)=>{
drawPlayer(p,"#1976ff",[7,11,8][i]);
});

drawPlayer(me,"#1976ff",10);

enemies.forEach((p,i)=>{
drawPlayer(p,"#e53935",[9,11,7][i]);
});

drawPlayer(keeper,"#ff9800",1);

drawBall();

drawAim();

requestAnimationFrame(game);

}

game();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ARIF FOOTBALL</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#111;
font-family:Arial;
}

canvas{
display:block;
width:100%;
height:100%;
touch-action:none;
}

#score{
position:fixed;
top:12px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.8);
color:white;
padding:10px 20px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:5;
}

#help{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.75);
color:white;
padding:9px 15px;
border-radius:20px;
z-index:5;
font-size:13px;
}
</style>
</head>

<body>

<div id="score">ARIF FC 0 : 0 RIVAL</div>
<div id="help">Player-এর কাছে বল এলে টেনে Pass / Shoot কর</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
W=innerWidth;
H=innerHeight;
canvas.width=W;
canvas.height=H;
}

resize();
addEventListener("resize",resize);


/* =========================
   GAME DATA
========================= */

let scoreA=0;
let scoreB=0;

const blue=[
{x:.20,y:.50,n:10},
{x:.34,y:.30,n:7},
{x:.34,y:.70,n:11},
{x:.45,y:.50,n:8}
];

const red=[
{x:.70,y:.30,n:9},
{x:.70,y:.70,n:11},
{x:.82,y:.50,n:7},
{x:.92,y:.50,n:1}
];

let controlled=0;

const ball={
x:0,
y:0,
vx:0,
vy:0,
r:9
};

function reset(){

ball.x=blue[controlled].x*W;
ball.y=70+blue[controlled].y*(H-100);

ball.vx=0;
ball.vy=0;

}

reset();


/* =========================
   FIELD
========================= */

function field(){

ctx.fillStyle="#15863a";
ctx.fillRect(0,0,W,H);

ctx.strokeStyle="white";
ctx.lineWidth=4;

ctx.strokeRect(15,70,W-30,H-100);

ctx.beginPath();
ctx.moveTo(W/2,70);
ctx.lineTo(W/2,H-30);
ctx.stroke();

ctx.beginPath();
ctx.arc(W/2,H/2,70,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.arc(W/2,H/2,5,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();


/* penalty */

ctx.strokeRect(15,H/2-115,125,230);

ctx.strokeRect(W-140,H/2-115,125,230);


/* goal */

ctx.strokeRect(0,H/2-65,15,130);

ctx.strokeRect(W-15,H/2-65,15,130);

}


/* =========================
   PLAYER
========================= */

function player(p,color){

let x=p.x*W;
let y=70+p.y*(H-100);

ctx.beginPath();
ctx.arc(x,y,22,0,Math.PI*2);

ctx.fillStyle=color;
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=3;
ctx.stroke();

ctx.fillStyle=color=="#1976ff"?"white":"white";

ctx.font="bold 13px Arial";
ctx.textAlign="center";
ctx.textBaseline="middle";

ctx.fillText(p.n,x,y);

}


/* =========================
   BALL
========================= */

function drawBall(){

ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);

ctx.fillStyle="white";
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=2;
ctx.stroke();

}


/* =========================
   PLAYER AI MOVEMENT
========================= */

function movePlayers(){

/* blue players */

blue.forEach((p,i)=>{

let targetX=p.x*W;
let targetY=70+p.y*(H-100);

if(i!==controlled){

targetX=ball.x + (i%2===0 ? -100 : -160);

targetY=70+
Math.max(
.15,
Math.min(
.85,
(ball.y-70)/(H-100)+(i-2)*.12
)
)*(H-100);

}

p.x += (targetX/W-p.x)*0.008;

p.y += ((targetY-70)/(H-100)-p.y)*0.008;

});


/* red defenders */

red.forEach((p,i)=>{

let targetX=p.x*W;
let targetY=70+p.y*(H-100);

if(i<3){

targetX=ball.x+80;

targetY=ball.y+(i-1)*90;

}

p.x+=(targetX/W-p.x)*0.006;

p.y+=((targetY-70)/(H-100)-p.y)*0.006;

});


/* goalkeeper */

let g=red[3];

g.x=.94;

g.y+=(Math.max(.25,Math.min(.75,(ball.y-70)/(H-100)))-g.y)*.03;

}


/* =========================
   BALL PHYSICS
========================= */

function physics(){

ball.x+=ball.vx;
ball.y+=ball.vy;

ball.vx*=.985;
ball.vy*=.985;


/* top bottom */

if(ball.y<82){

ball.y=82;
ball.vy*=-.7;

}

if(ball.y>H-38){

ball.y=H-38;
ball.vy*=-.7;

}


/* left */

if(ball.x<20){

if(
ball.y>H/2-65 &&
ball.y<H/2+65
){

scoreB++;
updateScore();
reset();

}else{

ball.x=20;
ball.vx*=-.7;

}

}


/* right */

if(ball.x>W-20){

if(
ball.y>H/2-65 &&
ball.y<H/2+65
){

scoreA++;
updateScore();
reset();

}else{

ball.x=W-20;
ball.vx*=-.7;

}

}


/* goalkeeper collision */

let g=red[3];

let gx=g.x*W;
let gy=70+g.y*(H-100);

let d=Math.hypot(ball.x-gx,ball.y-gy);

if(d<35){

ball.vx*=-.9;
ball.vy+=(ball.y-gy)*.04;

}


/* player ball control */

blue.forEach((p,i)=>{

let px=p.x*W;
let py=70+p.y*(H-100);

let d=Math.hypot(ball.x-px,ball.y-py);

if(d<30 && Math.abs(ball.vx)<3){

ball.x=px+25;
ball.y=py;

}

});

}


/* =========================
   DRAG SYSTEM
========================= */

let dragging=false;
let aimX=0;
let aimY=0;

function pos(e){

let r=canvas.getBoundingClientRect();

return{
x:e.clientX-r.left,
y:e.clientY-r.top
};

}

canvas.addEventListener("pointerdown",e=>{

let p=pos(e);

let d=Math.hypot(
p.x-ball.x,
p.y-ball.y
);

if(d<45){

dragging=true;

aimX=p.x;
aimY=p.y;

canvas.setPointerCapture(e.pointerId);

}

});


canvas.addEventListener("pointermove",e=>{

if(!dragging)return;

let p=pos(e);

aimX=p.x;
aimY=p.y;

});


canvas.addEventListener("pointerup",e=>{

if(!dragging)return;

let dx=ball.x-aimX;
let dy=ball.y-aimY;

let power=Math.hypot(dx,dy);

if(power>10){

power=Math.min(power/8,22);

ball.vx=dx/Math.hypot(dx,dy)*power;
ball.vy=dy/Math.hypot(dx,dy)*power;

}

dragging=false;

});


/* =========================
   AIM LINE
========================= */

function aim(){

if(!dragging)return;

ctx.beginPath();

ctx.moveTo(ball.x,ball.y);
ctx.lineTo(aimX,aimY);

ctx.strokeStyle="#ffe600";
ctx.lineWidth=5;

ctx.stroke();

}


/* =========================
   SCORE
========================= */

function updateScore(){

document.getElementById("score").innerText=
"ARIF FC "+scoreA+" : "+scoreB+" RIVAL";

}


/* =========================
   GAME LOOP
========================= */

function loop(){

field();

movePlayers();

physics();

blue.forEach(p=>player(p,"#1976ff"));

red.forEach(p=>player(p,"#e53935"));

drawBall();

aim();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
